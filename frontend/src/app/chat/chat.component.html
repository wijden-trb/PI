<div class="chat-popup">

  <div class="chat-header">

    <span>Chat</span>

  </div>

  <div class="chat-body">

    <div
      *ngFor="let msg of messages"
      class="message"
    >

      <strong>
        {{ msg.sender }}
      </strong>

      :

      {{ msg.content }}

    </div>

  </div>

  <div class="chat-footer">

    <input
      [(ngModel)]="message"
      placeholder="Type message..."
    >

    <button (click)="send()">
      Send
    </button>

  </div>

</div>
